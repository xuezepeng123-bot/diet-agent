spring:
  application:
    name: harness-agent
  datasource:
    url: '${DIET_DB_URL}'
    username: '${DIET_DB_USER}'
    password: '${DIET_DB_PASSWORD}'
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.diet.model
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
agentscope:
  dashscope:
    api-key: '${DASHSCOPE_API_KEY:}'
diet:
  llm:
    main-model: qwen-max
    light-model: qwen-turbo
  session:
    max-history-turns: 10
logging:
  level:
    com.diet: INFO
